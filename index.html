<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YVY - Explore informações</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <main>
        <section id="boas-vindas">
            <div class="mensagem">
                <h1>YVY</h1>
                <h2>Dados, cultura e conhecimento</h2>
            </div>
            <div class="botao-iniciar">
                <a href="#selecionar-lugar">Começar a explorar</a>
            </div>
        </section>
        <!-- Fim boas=vindas -->
        
        <section id="selecionar-lugar">
            <h1>Selecione um país</h1>
            <div class="continentes">
                <div class="continente">
                    <h2>África</h2>
                    <ul>
                        <li>Angola</li>
                        <li>Marrocos</li>
                        <li>Madagascar</li>
                    </ul>
                </div>
                <div class="continente">
                    <h2>América</h2>
                    <ul>
                        <li>Argentina</li>
                        <li>Brasil</li>
                        <li>Chile</li>
                    </ul>
                </div>
                <div class="continente">
                    <h2>Ásia</h2>
                    <ul>
                        <li>Japão</li>
                        <li>Turquia</li>
                        <li>China</li>
                    </ul>
                </div>
                <div class="continente">
                    <h2>Europa</h2>
                    <ul>
                        <li>Espanha</li>
                        <li>Itália</li>
                        <li>Suíça</li>
                    </ul>
                </div>
                <div class="continente">
                    <h2>Oceania</h2>
                    <ul>
                        <li>Austrália</li>
                        <li>Fiji</li>
                        <li>Nova Zelândia</li>
                    </ul>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
