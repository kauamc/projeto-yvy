<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YVY - Suporte</title>
    <link rel="stylesheet" href="../../estilos/header.css">
    <link rel="stylesheet" href="../../estilos/style.css">
    <link rel="stylesheet" href="../../suporte.css">
    <link rel="stylesheet" href="../../estilos/mobile-medio.css" media="screen and (min-width: 601px)">
</head>
<body>
    <div id="header"></div>
    <main>
        <section id="caixa-suporte">
            <h1>Suporte YVY</h1>
            <p>Se você tiver alguma dúvida ou precisar de ajuda, não hesite em nos contatar. Estamos aqui para ajudar!</p>
            <form action="suporte.php" method="post">
                <div>
                    <label for="nome">Seu nome</label>
                    <input type="text" name="nome" id="nome" required>
                </div>

                <div>
                    <label for="email">Seu e-mail</label>
                    <input type="email" name="email" id="email" required>
                </div>

                <div>
                    <label for="mensagem">Seu problema/dúvida</label>
                    <textarea name="mensagem" id="mensagem" required></textarea>
                </div>
                <div>
                    <input type="submit" value="Enviar">
                </div>
            </form>
        </section>
    </main>
    <div id="footer"></div>

    <script src="../../scripts/componentes.js"></script>
    <script src="../../scripts/main.js"></script>
</body>
</html>
